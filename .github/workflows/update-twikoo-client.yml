name: Auto Update Twikoo Client CDN

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）检查
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get latest twikoo version from npm
        id: latest
        run: |
          LATEST=$(npm view twikoo version 2>/dev/null)
          echo "Twikoo 前端最新版: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Get current version from comment.config.js
        id: current
        run: |
          CURRENT=$(grep -oP 'twikoo@\K[\d.]+' conf/comment.config.js | head -1)
          echo "Twikoo 前端当前版: $CURRENT"
          echo "version=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update CDN version if changed
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          sed -i "s/twikoo@${{ steps.current.outputs.version }}/twikoo@${{ steps.latest.outputs.version }}/g" conf/comment.config.js
          echo "已更新: ${{ steps.current.outputs.version }} -> ${{ steps.latest.outputs.version }}"

      - name: Commit and push
        if: steps.latest.outputs.version != steps.current.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add conf/comment.config.js
          git commit -m "chore(deps): update twikoo client to v${{ steps.latest.outputs.version }}"
          git push
